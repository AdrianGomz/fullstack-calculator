worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    server_tokens off;
    sendfile on;

    # All runtime writes must work as the unprivileged nginx user.
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # Resolve through Docker DNS on requests, including after recreation.
        resolver 127.0.0.11 valid=5s ipv6=off;
        resolver_timeout 2s;
        set $api_backend http://backend:8080;

        # API errors must stay JSON and never fall back to the React page.
        location ~ ^/(api(?:/|$)|health$) {
            proxy_pass $api_backend$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_intercept_errors off;
            proxy_connect_timeout 2s;
            proxy_read_timeout 15s;

            # Go enforces the 4096-byte limit and supplies its JSON error.
            client_max_body_size 0;
            proxy_request_buffering off;
        }

        location /assets/ {
            try_files $uri =404;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
